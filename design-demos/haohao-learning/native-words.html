<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>好好输入法 · 原生界面设计</title>
<style>
[hidden]{display:none!important}
*{box-sizing:border-box}body{margin:0;padding:32px;background:#e9e5dc;color:#513a32;font:16px/1.5 system-ui,"Microsoft YaHei",sans-serif}h1{font-size:26px;margin:0 0 8px}body>p{max-width:850px}main{display:flex;gap:24px;flex-wrap:wrap}.phone{width:360px;height:740px;display:flex;flex-direction:column;background:var(--bg);color:var(--fg);border-radius:24px;overflow:hidden;box-shadow:0 8px 26px #33271818;--bg:#f7f4ec;--surface:#fffdf8;--fg:#513a32;--muted:#7a6860;--line:#e3ddd2;--mint:#dcece2;--honey:#f4bf61;--keybed:#e7e2d8}.dark{--bg:#1d1c19;--surface:#292723;--fg:#f4ece2;--muted:#c6b8aa;--line:#45413a;--mint:#354d41;--honey:#e0a947;--keybed:#24231f}.status{padding:12px 22px;font-size:12px}.bar{display:flex;align-items:center;justify-content:space-between;padding:12px 20px;font-size:20px;font-weight:600}.content{padding:20px;flex:1;overflow:auto}.intro{font-size:14px;color:var(--muted);margin:0 0 20px}.primary,button{border:0;border-radius:12px;padding:14px 18px;min-height:48px;background:var(--honey);color:#513a32;font:600 15px system-ui;cursor:pointer}.secondary{background:var(--mint);color:var(--fg)}.actions{display:flex;gap:8px;align-items:center}.actions>*{flex:1}.tabs{display:flex;gap:6px;margin:24px 0 14px;font-size:14px}.tabs span{padding:10px 8px;white-space:nowrap}.tabs .active{background:var(--mint);border-radius:9px}.search{background:var(--surface);padding:13px 14px;border-radius:12px;color:var(--muted);font-size:14px}.word{padding:18px 0;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between}.word strong{display:block;font-size:23px;letter-spacing:-.3px}.word small{color:var(--muted);font-size:14px}.word .meta{font-size:12px;margin-top:5px;color:var(--muted)}.icon{background:transparent;color:var(--fg);padding:12px;min-width:48px}.icon svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.7}.hint{font-size:12px;color:var(--muted);margin:16px 0}.chat{flex:1;padding:24px;color:var(--muted)}.bubble{margin:100px 0 20px;padding:14px;background:var(--mint);border-radius:14px;color:var(--fg)}.input{margin:0 14px 12px;padding:10px;background:var(--surface);border-radius:10px}.keyboard{background:var(--keybed);padding:8px 4px 24px}.candidate{display:flex;padding:4px 5px 14px;justify-content:space-around;text-align:center}.candidate b{font-size:18px}.candidate small{display:block;font-size:12px;color:var(--muted)}.keyrow{display:flex;gap:4px;margin:0 0 6px;justify-content:center}.key{height:43px;flex:1;background:var(--surface);border-radius:7px;display:grid;place-items:center;font-size:19px;box-shadow:0 1px 0 #33271822}.key.function{background:var(--mint);font-size:15px}.key.return{background:var(--honey);color:#513a32;font-size:15px}.progress{height:3px;background:var(--line);margin-top:12px}.progress i{display:block;width:40%;height:100%;background:var(--honey)}.review{display:flex;flex:1;flex-direction:column;padding:24px 20px}.question{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}.question h2{font-size:38px;letter-spacing:-1px;margin:8px 0}.question p{color:var(--muted);margin:8px 0}.answer{font-size:23px;color:var(--fg)!important}.review .actions button{font-size:14px;padding:12px 4px}.caption{padding:10px 20px;background:var(--surface);font-size:12px;color:var(--muted)}@media(max-width:420px){body{padding:16px}main{gap:20px}.phone{width:100%}}
</style>
<h1>好好输入法 · 温暖但精致</h1><p>键盘、我的单词与复习页共用同一套配色和控件。以下为设计示意，示例词汇和进度不代表真实使用数据。下方同时展示浅色与深色，复习页可点击查看答案。</p>
<main id="screens"></main>
<template id="words"><div class="bar">我的单词 <span>···</span></div><div class="content"><p class="intro">从自己遇见的词，慢慢学会表达。</p><div class="actions"><button>复习 5 个词</button><button class="secondary">每日计划</button></div><div class="tabs"><span class="active">最近遇见</span><span>我的收藏</span><span>正在学习</span></div><div class="search">搜索中文或英文</div><div class="word"><div><strong>learn</strong><small>学习 · /lɝn/</small><div class="meta">今天遇见 · 3 次</div></div><button class="icon" aria-label="查看释义">›</button></div><div class="word"><div><strong>tomorrow</strong><small>明天 · /təˈmɑroʊ/</small><div class="meta">今天遇见 · 1 次</div></div><button class="icon" aria-label="查看释义">›</button></div><div class="word"><div><strong>coffee</strong><small>咖啡 · /ˈkɔfi/</small><div class="meta">昨天遇见 · 2 次</div></div><button class="icon" aria-label="查看释义">›</button></div><p class="hint">遇见次数仅表示输入频率。打开释义后，可主动加入学习。</p></div></template>
<template id="keyboard"><div class="bar">输入示意</div><div class="chat"><div class="bubble">我们明天一起学习吧。</div><p>英文候选安静出现，中文始终清楚。</p></div><div class="input">学习</div><div class="keyboard"><div class="candidate"><div><b>学习</b><small>learn</small></div><div><b>学期</b><small>semester</small></div><div><b>学</b><small>study</small></div><div><b>雪</b><small>snow</small></div></div><div class="letters"></div><div class="keyrow"><div class="key function">?123</div><div class="key function">中/英</div><div class="key">，</div><div class="key" style="flex:3">空格</div><div class="key">。</div><div class="key return">发送</div></div></div></template>
<template id="review"><div class="bar">轻复习 <span style="font-size:14px">2 / 5</span></div><div class="review"><p class="intro">想一想它的中文意思</p><div class="progress"><i></i></div><div class="question"><p>来自你主动加入的单词</p><h2>tomorrow</h2><p>/təˈmɑroʊ/</p><p class="answer" hidden>明天</p><p class="source" hidden>离线词典 · 当前保存义项</p></div><button class="reveal">查看答案</button><div class="actions ratings" hidden><button class="secondary">忘记了</button><button class="secondary">有印象</button><button>记住了</button></div><p class="hint">随时退出，已经完成的复习会保留。</p></div></template>
<script>
for(const dark of [false,true])for(const name of ['keyboard','words','review']){const phone=document.createElement('section');phone.className='phone'+(dark?' dark':'');phone.innerHTML='<div class="status">9:41</div>';phone.append(document.getElementById(name).content.cloneNode(true));const cap=document.createElement('div');cap.className='caption';cap.textContent=(dark?'深色':'浅色')+' · '+({keyboard:'输入键盘',words:'我的单词',review:'主动回想'}[name]);phone.append(cap);document.getElementById('screens').append(phone);const letters=phone.querySelector('.letters');if(letters)for(const [i,row] of ['qwertyuiop','asdfghjkl','zxcvbnm'].entries()){const el=document.createElement('div');el.className='keyrow';if(i===1)el.style.padding='0 16px';el.innerHTML=(i===2?'<div class="key function">Shift</div>':'')+[...row].map(x=>'<div class="key">'+x+'</div>').join('')+(i===2?'<div class="key function">⌫</div>':'');letters.append(el)}phone.querySelector('.reveal')?.addEventListener('click',e=>{e.target.hidden=true;phone.querySelector('.answer').hidden=false;phone.querySelector('.source').hidden=false;phone.querySelector('.ratings').hidden=false})}
</script></html>
