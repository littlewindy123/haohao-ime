preset_keyboards:
  qwerty:
    import_preset: default
  default:
    name: 好好 26 键
    author: HaoHao IME contributors
    ascii_mode: 0
    reset_ascii_mode: true
    lock: true
    width: 10
    height: 50
    keys:
      - {click: q, label_symbol: "1", long_click: "1"}
      - {click: w, label_symbol: "2", long_click: "2"}
      - {click: e, label_symbol: "3", long_click: "3"}
      - {click: r, label_symbol: "4", long_click: "4"}
      - {click: t, label_symbol: "5", long_click: "5"}
      - {click: y, label_symbol: "6", long_click: "6"}
      - {click: u, label_symbol: "7", long_click: "7"}
      - {click: i, label_symbol: "8", long_click: "8"}
      - {click: o, label_symbol: "9", long_click: "9"}
      - {click: p, label_symbol: "0", long_click: "0"}
      - {width: 5}
      - {click: a, label_symbol: "~", long_click: "~"}
      - {click: s, label_symbol: "@", long_click: "@"}
      - {click: d, label_symbol: "#", long_click: "#"}
      - {click: f, label_symbol: "!", long_click: "!"}
      - {click: g, label_symbol: "%", long_click: "%"}
      - {click: h, label_symbol: "&", long_click: "&"}
      - {click: j, label_symbol: "*", long_click: "*"}
      - {click: k, label_symbol: "(", long_click: "("}
      - {click: l, label_symbol: ")", long_click: ")"}
      - {width: 5}
      - {click: Shift_L, long_click: Shift_L, width: 15}
      - {click: z, label_symbol: "`", long_click: "`"}
      - {click: x, label_symbol: "/", long_click: "/"}
      - {click: c, label_symbol: "-", long_click: "-"}
      - {click: v, label_symbol: "_", long_click: "_"}
      - {click: b, label_symbol: ":", long_click: ":"}
      - {click: n, label_symbol: ";", long_click: ";"}
      - {click: m, label_symbol: "?", long_click: "?"}
      - {click: BackSpace, width: 15}
      - {click: HaoHaoSymbols, width: 14}
      - {click: HaoHaoNumber, width: 12}
      - {click: ",", label: "，", width: 10}
      - {click: HaoHaoSpace, width: 28}
      - {click: ".", label: "。", width: 10}
      - {click: Mode_switch, width: 12}
      - {click: HaoHaoReturn, width: 14, key_back_color: on_key_back_color, key_text_color: on_key_text_color}

  number:
    name: 好好数字
    author: HaoHao IME contributors
    ascii_mode: 1
    reset_ascii_mode: false
    width: 10
    height: 50
    keys:
      - {click: "1"}
      - {click: "2"}
      - {click: "3"}
      - {click: "4"}
      - {click: "5"}
      - {click: "6"}
      - {click: "7"}
      - {click: "8"}
      - {click: "9"}
      - {click: "0"}
      - {click: "+"}
      - {click: "-"}
      - {click: "*"}
      - {click: "/"}
      - {click: "="}
      - {click: "%"}
      - {click: "￥"}
      - {click: "$"}
      - {click: "@"}
      - {click: "#"}
      - {click: "("}
      - {click: ")"}
      - {click: "["}
      - {click: "]"}
      - {click: "{"}
      - {click: "}"}
      - {click: ":"}
      - {click: "."}
      - {click: BackSpace, width: 20}
      - {click: HaoHaoLetters, width: 20}
      - {click: HaoHaoSymbols, width: 20}
      - {click: HaoHaoSpace, width: 40}
