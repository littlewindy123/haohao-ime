    hilited_key_symbol_color: 0xe8ac43
    hilited_off_key_back_color: 0xc8dece
    hilited_off_key_text_color: 0x513a32
    hilited_off_key_symbol_color: 0xe8ac43
    hilited_on_key_back_color: 0xe8ac43
    hilited_on_key_text_color: 0x513a32
    hilited_on_key_symbol_color: 0xfffdf8
    hilited_candidate_back_color: 0xdcece2
    hilited_candidate_text_color: 0x513a32
    hilited_comment_text_color: 0x426c54
    hilited_back_color: 0xdcece2
    hilited_text_color: 0x426c54
    preview_back_color: 0x513a32
    preview_text_color: 0xfffdf8
    shadow_color: 0x000000

  haohao_dark:
    name: 好好深色
    author: HaoHao IME contributors
    light_scheme: default
    back_color: 0x24231f
    root_background: 0x1d1c19
    keyboard_back_color: 0x24231f
    candidate_background: 0x24231f
    candidate_border_color: 0x45413a
    candidate_separator_color: 0x45413a
    border_color: 0x45413a
    candidate_text_color: 0xf4ece2
    comment_text_color: 0xc6b8aa
    label_color: 0xc6b8aa
    text_color: 0xf0bd60
    text_back_color: 0x24231f
    key_back_color: 0x302d28
    key_border_color: 0x45413a
    key_shadow_color: 0x66000000
