    hilited_off_key_symbol_color: 0xd6e0ff
    hilited_on_key_back_color: 0x9ab7ff
    hilited_on_key_text_color: 0x1f2125
    hilited_on_key_symbol_color: 0x1f2125
    hilited_candidate_back_color: 0x3b496a
    hilited_candidate_text_color: 0xffffff
    hilited_comment_text_color: 0x9ab7ff
    hilited_back_color: 0x3b496a
    hilited_text_color: 0x9ab7ff
    preview_back_color: 0xf2f4f7
    preview_text_color: 0x1f2125
