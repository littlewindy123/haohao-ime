preset_keyboards:
  qwerty:
    import_preset: default
  default:
    name: 好好 26 键
    author: HaoHao IME contributors
    ascii_mode: 0
    reset_ascii_mode: true
    lock: true
    width: 10
    height: 56
    keys:
      - {click: q}
      - {click: w}
      - {click: e}
      - {click: r}
      - {click: t}
      - {click: y}
      - {click: u}
      - {click: i}
      - {click: o}
      - {click: p}
      - {width: 5}
      - {click: a}
      - {click: s}
      - {click: d}
      - {click: f}
      - {click: g}
      - {click: h}
      - {click: j}
      - {click: k}
      - {click: l}
      - {width: 5}
      - {click: Shift_L, width: 15}
      - {click: z}
      - {click: x}
      - {click: c}
      - {click: v}
      - {click: b}
      - {click: n}
      - {click: m}
      - {click: BackSpace, width: 15}
      - {click: HaoHaoNumber, width: 14}
      - {click: Mode_switch, width: 16}
      - {click: ",", label: "，"}
      - {click: HaoHaoSpace, width: 30}
      - {click: ".", label: "。"}
      - {click: HaoHaoReturn, width: 20}

  number:
    name: 好好数字
    author: HaoHao IME contributors
    ascii_mode: 1
    reset_ascii_mode: false
    width: 10
    height: 56
    keys:
