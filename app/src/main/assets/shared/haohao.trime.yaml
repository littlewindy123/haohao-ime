# 好好输入法的简体优先主题。继承原版 Trime 的颜色和通用候选配置，
# 仅覆盖面向普通中文用户的键盘布局与基础按键。
__include: trime:/

config_version: "3.3"
name: 好好输入法
author: HaoHao IME contributors

style:
  # Use the device's regular sans-serif, consistently across Chinese and Latin.
  candidate_font: ["system:sans-serif"]
  key_font: ["system:sans-serif"]
  comment_font: ["system:sans-serif"]
  symbol_font: ["system:sans-serif"]
  text_font: ["system:sans-serif"]
  candidate_padding: 10
  candidate_spacing: 2
  candidate_border: 0
  candidate_border_round: 0
  candidate_view_height: 40
  candidate_corner_radius: 8
  candidate_text_size: 20
  comment_text_size: 12
  comment_height: 0
  compact_candidate_text_size: 20
  compact_translation_text_size: 13
  compact_phonetic_text_size: 10
  horizontal_gap: 3
  vertical_gap: 8
  keyboard_padding: 3
  keyboard_padding_bottom: 40
  keyboard_padding_land: 24
  keyboard_padding_land_bottom: 6
  key_height: 50
  key_cap_height: 0
  key_text_size: 20
  key_long_text_size: 16
  symbol_text_size: 11
  key_border: 1
  key_press_offset_y: 1
  key_shadow_offset_y: 1
  label_text_size: 16
  popup_text_size: 16
  keyboard_height: 252
  keyboard_height_land: 180
  preview_height: 54
  preview_offset: -10
  preview_text_size: 18
  round_corner: 7
  reset_ascii_mode_on_focus_change: false

preedit:
  horizontal_padding: 10
  top_end_radius: 8
  foreground:
    font_size: 14

window:
  insets:
    vertical: 6
    horizontal: 6
  item_padding:
    vertical: 2
    horizontal: 6
  corner_radius: 12
  border: 1
  shadow: 4
  foreground:
    label_font_size: 12
    text_font_size: 16
    comment_font_size: 12

tool_bar:
  equal_width: true
  builtin_icon_size: 18
  builtin_icon_color: toolbar_icon_color
  builtin_icon_highlight_color: hilited_toolbar_icon_color
  button_spacing: 0
  primary_button:
    size: [48, 48]
    background:
      type: rectangle
      corner_radius: 8
      vertical_inset: 4
      horizontal_inset: 4
    foreground:
      style: "ic@view_grid_outline"
      normal: toolbar_icon_color
      highlight: hilited_toolbar_icon_color
      font_size: 18
      padding: 10
    action: HaoHaoToolbox
  buttons:
    - size: [48, 48]
      foreground: {style: "ic@chevron_down", normal: toolbar_icon_color, highlight: hilited_toolbar_icon_color, font_size: 18, padding: 10}
      action: Hide
    - size: [48, 48]
      foreground: {style: "ic@keyboard_outline", normal: toolbar_icon_color, highlight: hilited_toolbar_icon_color, font_size: 18, padding: 10}
      action: HaoHaoKeyboardMenu
    - size: [48, 48]
      foreground: {style: "ic@emoticon_outline", normal: toolbar_icon_color, highlight: hilited_toolbar_icon_color, font_size: 18, padding: 10}
      action: liquid_keyboard_emoji
    - size: [48, 48]
      foreground: {style: "ic@cursor_text", normal: toolbar_icon_color, highlight: hilited_toolbar_icon_color, font_size: 18, padding: 10}
      action: HaoHaoEditor
      long_press_action: clipboard_window
    - size: [48, 48]
      foreground: {style: "ic@microphone_outline", normal: toolbar_icon_color, highlight: hilited_toolbar_icon_color, font_size: 18, padding: 10}
      action: VOICE_ASSIST

preset_keys:
  BackSpace: {label: "ic@backspace_outline", preview: "", repeatable: true, slide_delete: true, functional: true, send: BackSpace}
  Shift_L: {label: "ic@apple_keyboard_shift", preview: "", functional: true, send: Shift_L, shift_lock: long}
  Mode_switch: {toggle: ascii_mode, preview: "", functional: true, send: SWITCH_CHARSET, states: [中, 英]}
  HaoHaoNumber: {label: "123", preview: "", functional: true, send: Eisu_toggle, select: number}
  HaoHaoNumberSymbols: {label: 符, preview: "", functional: true, send: Eisu_toggle, select: number_symbols}
  HaoHaoNumberBack: {label: 返回, preview: "", functional: true, send: Eisu_toggle, select: .default}
  HaoHaoNumberSpace: {label: "ic@keyboard_space", preview: "", slide_cursor: true, functional: false, send: space}
  HaoHaoSymbols: {label: 符, preview: "", functional: true, send: Eisu_toggle, select: symbols}
  HaoHaoLetters: {label: ABC, preview: "", functional: true, send: Eisu_toggle, select: .default}
  HaoHaoSpace: {label: "ic@keyboard_space", preview: "", slide_cursor: true, functional: false, send: space}
  HaoHaoReturn: {label: "ic@keyboard_return", preview: "", functional: true, send: Return}
  HaoHaoToolbox: {label: "好", preview: "", functional: true, send: FUNCTION, command: haohao_toolbox}
  HaoHaoPhrases: {label: 常用语, preview: "", functional: true, send: FUNCTION, command: clipboard_window, option: '1'}
  HaoHaoTranslation: {label: 翻译, preview: "", functional: true, send: FUNCTION, command: haohao_translation}
  HaoHaoInputFootprints: {label: 单词, preview: "", functional: true, send: FUNCTION, command: haohao_input_footprints}
  HaoHaoEditor: {label: 编辑, preview: "", functional: true, send: FUNCTION, command: haohao_editor}
  HaoHaoKeyboardMenu: {label: 键盘, preview: "", functional: true, send: FUNCTION, command: menu_keyboard}
  HaoHaoNineSplit: {label: 分词, preview: "", send: apostrophe}
  HaoHaoNineClear: {label: 重输, preview: "", functional: true, send: Escape}

