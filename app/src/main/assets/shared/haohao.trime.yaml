    text_back_color: 0x26282d
    key_back_color: 0x2b2e34
    key_border_color: 0x2b2e34
    key_text_color: 0xf2f4f7
    key_symbol_color: 0xaab0bb
    off_key_back_color: 0x363a43
    off_key_text_color: 0xf2f4f7
    off_key_symbol_color: 0xb8bec8
    on_key_back_color: 0x7ea2ff
    on_key_text_color: 0x1f2125
