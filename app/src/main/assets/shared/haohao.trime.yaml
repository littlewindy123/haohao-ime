    key_text_color: 0xf4ece2
    key_symbol_color: 0x767c86
    off_key_back_color: 0x354d41
    off_key_text_color: 0xf4ece2
    off_key_symbol_color: 0x767c86
    toolbar_icon_color: 0x9298a2
    hilited_toolbar_icon_color: 0xf0bd60
