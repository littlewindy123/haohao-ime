# 好好输入法的简体优先主题。继承原版 Trime 的颜色和通用候选配置，
# 仅覆盖面向普通中文用户的键盘布局与基础按键。
__include: trime:/

config_version: "2.0"
name: 好好输入法
author: HaoHao IME contributors

style:
  candidate_padding: 4
  candidate_spacing: 2
  candidate_border: 0
  candidate_border_round: 0
  candidate_view_height: 30
  candidate_corner_radius: 8
  candidate_text_size: 16
  comment_text_size: 12
  compact_candidate_text_size: 16
  compact_translation_text_size: 12
  compact_phonetic_text_size: 10
  horizontal_gap: 4
  vertical_gap: 9
  keyboard_padding: 5
  keyboard_padding_bottom: 4
  keyboard_padding_land: 24
  keyboard_padding_land_bottom: 6
  key_height: 50
  key_text_size: 16
  key_long_text_size: 14
  symbol_text_size: 10
  key_border: 1
  key_press_offset_y: 1
  key_shadow_offset_y: 2
  label_text_size: 16
  popup_text_size: 16
  keyboard_height: 232
  keyboard_height_land: 220
  preview_height: 54
  preview_offset: -10
  preview_text_size: 18
  round_corner: 7
  reset_ascii_mode_on_focus_change: false

preedit:
  horizontal_padding: 10
  top_end_radius: 8
  foreground:
    font_size: 14

window:
  insets:
    vertical: 6
    horizontal: 6
  item_padding:
    vertical: 2
    horizontal: 6
  corner_radius: 12
  border: 1
  shadow: 4
  foreground:
    label_font_size: 12
    text_font_size: 16
    comment_font_size: 12

tool_bar:
  equal_width: true
  builtin_icon_size: 21
  button_spacing: 0
  primary_button:
    size: [48, 48]
    background:
      type: rectangle
      corner_radius: 8
      vertical_inset: 4
      horizontal_inset: 4
    foreground:
      style: "ic@view_grid_outline"
      normal: candidate_text_color
      highlight: hilited_comment_text_color
      font_size: 21
      padding: 10
    action: HaoHaoToolbox
  buttons:
    - size: [48, 48]
      foreground: {style: "ic@keyboard_close", font_size: 21, padding: 10}
      action: Hide
    - size: [48, 48]
      foreground: {style: "ic@emoticon_outline", font_size: 21, padding: 10}
      action: liquid_keyboard_emoji
    - size: [48, 48]
      foreground: {style: "ic@clipboard_text_outline", font_size: 21, padding: 10}
      action: clipboard_window

preset_keys:
  BackSpace: {label: "⌫", preview: "", repeatable: true, slide_delete: true, functional: true, send: BackSpace}
  Shift_L: {label: "⇧", preview: "", functional: true, send: Shift_L, shift_lock: long}
  Mode_switch: {toggle: ascii_mode, preview: "", functional: true, send: SWITCH_CHARSET, states: [中, En]}
  HaoHaoNumber: {label: "123", preview: "", functional: true, send: Eisu_toggle, select: number}
  HaoHaoSymbols: {label: 符, preview: "", functional: true, send: Eisu_toggle, select: symbols}
  HaoHaoLetters: {label: ABC, preview: "", functional: true, send: Eisu_toggle, select: .default}
  HaoHaoSpace: {label: " ", preview: "", slide_cursor: true, functional: false, send: space}
  HaoHaoReturn: {label: "↵", preview: "", functional: true, send: Return}
  HaoHaoToolbox: {label: "好", preview: "", functional: true, send: FUNCTION, command: haohao_toolbox}
  HaoHaoTranslation: {label: 翻译, preview: "", functional: true, send: FUNCTION, command: haohao_translation}
  HaoHaoInputFootprints: {label: 足迹, preview: "", functional: true, send: FUNCTION, command: haohao_input_footprints}
  HaoHaoEditor: {label: 编辑, preview: "", functional: true, send: FUNCTION, command: haohao_editor}

preset_color_schemes:
  default:
    name: 好好浅色
    author: HaoHao IME contributors
