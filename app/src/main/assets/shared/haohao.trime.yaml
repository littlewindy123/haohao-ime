      - {click: "3"}
      - {click: "4"}
      - {click: "5"}
      - {click: "6"}
      - {click: "7"}
      - {click: "8"}
      - {click: "9"}
      - {click: "0"}
      - {click: "+"}
      - {click: "-"}
      - {click: "*"}
      - {click: "/"}
      - {click: "="}
      - {click: "%"}
      - {click: "￥"}
      - {click: "$"}
      - {click: "@"}
      - {click: "#"}
      - {click: "("}
      - {click: ")"}
      - {click: "["}
      - {click: "]"}
