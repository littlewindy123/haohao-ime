preset_keyboards:
  qwerty:
    import_preset: default
  default:
    name: 好好 26 键
    author: HaoHao IME contributors
    ascii_mode: 0
    reset_ascii_mode: true
    ascii_keyboard: haohao_english
    lock: true
    label_transform: uppercase
    width: 10
    height: 50
    keys:
      - {click: q, label_symbol: "1", long_click: "1"}
      - {click: w, label_symbol: "2", long_click: "2"}
      - {click: e, label_symbol: "3", long_click: "3"}
      - {click: r, label_symbol: "4", long_click: "4"}
      - {click: t, label_symbol: "5", long_click: "5"}
      - {click: y, label_symbol: "6", long_click: "6"}
