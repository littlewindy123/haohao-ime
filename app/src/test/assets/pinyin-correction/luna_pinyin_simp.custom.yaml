      - haohao_pinyin_correction:/fuzzy_s_sh
      - haohao_pinyin_correction:/fuzzy_c_ch
      - haohao_pinyin_correction:/fuzzy_z_zh
      - haohao_pinyin_correction:/fuzzy_l_n
      - haohao_pinyin_correction:/fuzzy_f_h
      - haohao_pinyin_correction:/fuzzy_r_l
      - haohao_pinyin_correction:/fuzzy_an_ang
      - haohao_pinyin_correction:/fuzzy_en_eng
      - haohao_pinyin_correction:/fuzzy_in_ing
      - haohao_pinyin_correction:/fuzzy_ian_iang
      - haohao_pinyin_correction:/fuzzy_uan_uang
