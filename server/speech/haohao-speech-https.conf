server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name 124.221.187.214;
    ssl_certificate /etc/letsencrypt/live/haohao-ip/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/haohao-ip/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:haohao_speech_tls:1m;
    ssl_session_timeout 10m;
    server_tokens off;

    # The static website is the same release, with unchanged download paths.
    root /www/wwwroot/haohao-ime/current;
    index index.html;
    charset utf-8;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options DENY always;
    access_log off;
    error_log /www/wwwlogs/haohao-speech.error.log warn;

    location = /api/v1/speech {
        client_max_body_size 8k;
        client_body_timeout 8s;
        proxy_pass http://127.0.0.1:18761;
        proxy_set_header Host localhost;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For "";
        proxy_connect_timeout 2s;
        proxy_read_timeout 8s;
        proxy_send_timeout 8s;
        proxy_buffering off;
        proxy_next_upstream off;
        # Preserve the gateway's distinct 401/403/429/503 JSON codes.
        proxy_intercept_errors off;
        error_page 413 = @too_large;
        error_page 502 503 504 = @unavailable;
    }
    location @too_large { default_type application/json; return 413 '{"code":"INVALID_REQUEST"}'; }
    location @unavailable { default_type application/json; return 503 '{"code":"UPSTREAM_FAILED"}'; }
    location /api/ { return 404; }
    location / { try_files $uri $uri/ =404; }
}
